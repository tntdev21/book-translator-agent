name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpango-1.0-0 \
          libpangocairo-1.0-0 \
          libgdk-pixbuf2.0-0 \
          libffi-dev \
          shared-mime-info

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Create test fixtures
      run: |
        mkdir -p translated chunks output
        # Create minimal test chunk if none exists
        if [ ! -f "translated/chunk_001.md" ]; then
          echo "# Test Chapter" > translated/chunk_001.md
          echo "" >> translated/chunk_001.md
          echo "This is a test chunk for CI/CD." >> translated/chunk_001.md
        fi

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short --cov=scripts --cov-report=xml --cov-report=html

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short --cov=scripts --cov-append --cov-report=xml --cov-report=html

    - name: Run E2E tests
      run: |
        pytest tests/e2e/ -v --tb=short --cov=scripts --cov-append --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs-${{ matrix.python-version }}
        path: output/

    # Optional: Upload to codecov
    # - name: Upload to Codecov
    #   uses: codecov/codecov-action@v4
    #   with:
    #     file: ./coverage.xml
    #     flags: unittests
    #     name: codecov-${{ matrix.python-version }}
